apiVersion: v1
kind: Secret
metadata:
  name: dmr-postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmr-config
data:
  POSTGRES_USER: postgres
  POSTGRES_DB: model_repo
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/model_repo
  NATS_URL: nats://nats:4222
  COORDINATOR_PORT: "4000"
  COORDINATOR_HOST: 0.0.0.0
  DEFAULT_REPLICATION_FACTOR: "3"
  NODE_1_HOST: node-1
  NODE_1_PORT: "5001"
  NODE_2_HOST: node-2
  NODE_2_PORT: "5002"
  NODE_3_HOST: node-3
  NODE_3_PORT: "5003"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: dmr-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dmr-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d model_repo"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          ports:
            - containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  type: NodePort
  selector:
    app: coordinator
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: ds-project-backend:local
          imagePullPolicy: IfNotPresent
          command: ["node", "src/api/server.js"]
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: dmr-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: node-1
spec:
  selector:
    app: node-1
  ports:
    - name: grpc
      port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-1-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-1
  template:
    metadata:
      labels:
        app: node-1
    spec:
      containers:
        - name: storage-node
          image: ds-project-backend:local
          imagePullPolicy: IfNotPresent
          command: ["node", "src/storage/index.js"]
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: dmr-config
          env:
            - name: NODE_ID
              value: node-1
            - name: NODE_PORT
              value: "5001"
            - name: NODE_ADDRESS
              value: node-1
            - name: NODE_HOST
              value: 0.0.0.0
            - name: STORAGE_PATH
              value: /data
            - name: COORDINATOR_URL
              value: http://coordinator:4000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: node-1-data
---
